name: ci
on:
    push:
    pull_request:
    workflow_dispatch:
jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-14]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: cachix/install-nix-action@v31
            # pulls from dimos-desktop.cachix.org; pushes what it builds only when the CACHIX_AUTH_TOKEN secret is set
            - uses: cachix/cachix-action@v16
              with:
                  name: dimos-desktop
                  authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
            - run: nix build .#dimosApp -L
            # the map-build tests run the real mapper
            - run: nix build .#mapper -o result-mapper
            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.5.0 # the formatter changes between releases: pin the one `deno fmt` runs with locally
            # the backend's decoders (package.json) and the frontend's types
            - run: npm ci && (cd frontend && npm ci && npm run typecheck)
            - run: deno task test
            - run: deno task check
            - run: deno fmt --check && deno lint
